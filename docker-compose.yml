services:
  logger-service:
    build:
      context: .
    container_name: logger-asc-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PROJECT: logger-asc-service
      PLATFORM: nodejs
    volumes:
      - ./logs:/app/logs  # Logger writes here
    networks:
      - logger-net


  promtail:
    image: grafana/promtail:2.9.1
    container_name: promtail
    restart: unless-stopped
    ports:
      - "9080:9080"  # 🔥 Expose Promtail's HTTP API to the host
    volumes:
      - ./promtail-config.yaml:/etc/promtail-config.yml
      - ./logs:/var/log/logger  # shared volume for logs
    command: -config.file=/etc/promtail-config.yml
    networks:
      - logger-net

  loki:
    image: grafana/loki:2.9.1
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - logger-net  


  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "80:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - loki
    networks:
      - logger-net

volumes:
  grafana-storage:
  
networks:
  logger-net:
