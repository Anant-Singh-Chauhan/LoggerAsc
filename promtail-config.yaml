server:
  http_listen_port: 9080

positions:
  filename: /var/log/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: "loggerService"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "loggerService"
          __path__: "/var/log/app.log"
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            project: project
            platform: platform
            label: label
            user: user
            meta: meta
            timestamp: timestamp
      - labels:
          project:
          platform:
          label:
          user:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
